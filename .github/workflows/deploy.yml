name: Deploy to Server (Passpoli/Kanjur)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Restart PM2
        run: |
          # Since the home directory is mapped to /scratch/25m1528, 
          # we must explicitly load NVM so the runner knows where Node.js and PM2 are.
          export HOME=/scratch/25m1528
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          
          cd frontend
          npm ci
          npm run build
          
          # Start or restart with PM2
          pm2 restart mtp-frontend || pm2 start npm --name "mtp-frontend" -- run start
