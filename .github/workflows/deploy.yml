name: Deploy to Kanjur Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Restart PM2
        run: |
          cd frontend
          # Install dependencies
          npm ci
          # Build Next.js
          npm run build
          # Start or restart with PM2
          pm2 restart mtp-frontend || pm2 start npm --name "mtp-frontend" -- run start
