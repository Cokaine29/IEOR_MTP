name: Deploy to Server (Passpoli/Kanjur)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Restart PM2
        run: |
          # Load NVM
          export HOME=/scratch/25m1528
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          
          # Force Node 22 for modern Next.js and dependencies
          nvm install 22
          nvm use 22
          npm install -g pm2
          
          cd frontend
          npm ci
          npm run build
          
          # Start or restart with PM2
          pm2 restart mtp-frontend || pm2 start npm --name "mtp-frontend" -- run start
