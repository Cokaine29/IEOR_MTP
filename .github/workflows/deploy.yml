name: Deploy to Server (Passpoli/Kanjur)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Restart PM2
        env:
          RUNNER_TRACKING_ID: "" # Prevents GitHub from killing background processes
          http_proxy: "http://tp6.iitb.ac.in:80"
          https_proxy: "http://tp6.iitb.ac.in:80"
        run: |
          # Load NVM (using default home directory on Kopri)
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          
          # Force Node 22 for modern Next.js and dependencies
          nvm install 22
          nvm use 22
          npm install -g pm2
          
          cd frontend
          npm ci
          npm run build
          
          # Completely delete the old PM2 process to clear any bad cache
          pm2 delete mtp-frontend || true
          pm2 start npm --name "mtp-frontend" -- run start
